<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Email Writer</title>

    <link rel="stylesheet" href="style.css">

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</head>

<body>

    <div class="container">

        <h1>📧 AI Email Writer</h1>

        <p>Generate professional emails instantly using AI.</p>

        <input
            type="text"
            id="sender"
            placeholder="Your Name">

        <input
            type="text"
            id="recipient"
            placeholder="Recipient Name">

        <input
            type="text"
            id="subject"
            placeholder="Email Subject">

        <textarea
            id="purpose"
            rows="3"
            placeholder="Purpose of the Email"></textarea>

        <select id="tone">
            <option>Professional</option>
            <option>Friendly</option>
            <option>Formal</option>
            <option>Casual</option>
        </select>

        <textarea
            id="points"
            rows="5"
            placeholder="Key Points to Include"></textarea>

        <button id="generateBtn">
            ✨ Generate Email
        </button>

        <div class="actions">

            <button
                id="copyBtn"
                style="display:none;">
                📋 Copy Email
            </button>

            <button
                id="downloadBtn"
                style="display:none;">
                📄 Download PDF
            </button>

            <button
                id="regenerateBtn"
                style="display:none;">
                🔄 Regenerate Email
            </button>

        </div>

        <div id="loading"></div>

        <div id="result"></div>

    </div>

    <script src="script.js"></script>

</body>

</html>
